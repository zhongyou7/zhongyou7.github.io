<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="../icomoon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>贪吃蛇</title>
  <meta name="Description" content="Asamo 的贪吃蛇小游戏">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" type="text/css" href="../main.css"/>
  <script src="../theme.js"></script>
  <style>
    body { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    .game-wrap { margin-top: 56px; text-align: center; }
    h1 { font-size: 22px; }
    .score { font-size: 14px; margin: 10px 0 14px; color: var(--quote); }
    .score b { color: var(--h1); font-size: 18px; margin: 0 4px; }
    canvas {
      border-radius: 10px;
      border: 1px solid var(--quote-line);
      background: var(--bg);
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      touch-action: none;
    }
    .btns { margin-top: 14px; }
    .btns button {
      margin: 0 6px;
      padding: 6px 16px;
      border-radius: 8px;
      border: 1px solid var(--quote-line);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 13px;
      transition: background .2s;
    }
    .btns button:hover { background: var(--quote-line); }
    .hint { font-size: 12px; color: var(--location); margin-top: 14px; line-height: 1.7; }
    .back { margin-top: 18px; font-size: 13px; }
    .back a { color: var(--a); text-decoration: none; border-bottom: 1px dotted; }

    .overlay {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.5);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    .overlay.hidden { display: none; }
    .panel {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--quote-line);
      border-radius: 16px;
      padding: 26px 32px;
      text-align: center;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }
    .panel h2 { color: var(--h1); font-size: 18px; margin-bottom: 8px; }
    .panel p { font-size: 14px; margin-bottom: 14px; }
    .panel button {
      padding: 7px 20px; border-radius: 8px;
      border: 1px solid var(--quote-line);
      background: transparent; color: var(--text); cursor: pointer; font-size: 14px;
    }
    .panel button:hover { background: var(--quote-line); }
  </style>
</head>
<body>
  <div class="game-wrap">
    <h1>🐍 贪吃蛇</h1>
    <div class="score">得分<b id="score">0</b>最高<b id="best">0</b></div>
    <canvas id="snake" width="400" height="400"></canvas>
    <div class="btns">
      <button id="restart">重新开始</button>
      <button id="pause">暂停</button>
    </div>
    <div class="hint">方向键 / WASD 控制 · 空格暂停 · Esc 回主页 · 手机可滑动</div>
    <div class="back"><a href="../index.html">← 返回主页</a></div>
  </div>

  <div id="over" class="overlay hidden">
    <div class="panel">
      <h2>游戏结束</h2>
      <p id="over-msg">得分 0</p>
      <button id="over-btn">再来一局</button>
    </div>
  </div>

  <script src="snake.js"></script>
</body>
</html>
