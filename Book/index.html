<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <link rel="shortcut icon" href="icomoon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>阅读器</title>
  <meta name="Description" content="《明朝那些事儿》">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" type="text/css" href="main.css"/>
  <script src="theme.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      line-height: 1.6;
    }
    .bookmark-list li { margin: 14px 0; }
    .bookmark-list a {
      display: inline-block;
      text-decoration: none;
      border-bottom: 1px dotted;
      transition: border .3s ease, color .3s ease;
    }
    .bookmark-list a:hover { border-bottom: 1px solid; }
    .bookmark-empty { font-size: 13px; }

    .container {
      margin-top: 50px;
      padding: 0 12px;
      position: relative;
    }
    .top-bar {
      margin-bottom: 12px;
    }
    .top-bar button {
      padding: 6px 12px;
      border-radius: 6px;
      border: 1px solid #8883;
      background-color: rgba(127,127,127,0.08);
      cursor: pointer;
      transition: background 0.2s;
    }
    .top-bar button:hover {
      background-color: rgba(127,127,127,0.18);
    }

    /* 阅读器写死占满区域 */
    #epub-viewer {
      width: 100%;
      height: calc(100vh - 80px);
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
      overflow: auto;
      overflow-anchor: none !important;
      background: rgba(127,127,127,0.04);
    }

    /* 悬浮侧边目录，浮在上层 fixed */
    .sidebar-toc {
      position: fixed;
      top: 62px;
      left: 12px;
      z-index: 999;
      width: 270px;
      max-height: calc(100vh - 80px);
      overflow-y: auto;
      padding: 12px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.92);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
      backdrop-filter: blur(8px);
      transition: transform 0.24s ease;
      text-align: left !important;
    }
    .sidebar-toc.hidden {
      transform: translateX(-300px);
    }

    .toc-item {
      margin: 4px 0;
      text-align: left !important;
    }
    .toc-item a {
      display: block;
      padding: 5px 8px;
      border-radius: 5px;
      text-decoration: none;
      transition: background 0.2s;
      color:#222;
      text-align: left !important;
    }
    .toc-item a:hover {
      background-color: rgba(127,127,127,0.14);
    }
    .toc-item a.active-chapter {
      background-color: rgba(100,149,237,0.22);
    }
    .toc-level-1 { padding-left: 0px; }
    .toc-level-2 { padding-left: 14px; }
    .toc-level-3 { padding-left: 28px; }
    .toc-level-4 { padding-left: 42px; }

    /* 深色模式适配悬浮面板背景 */
    @media (prefers-color-scheme: dark) {
      .sidebar-toc {
        background: rgba(30,30,30,0.92);
      }
      .toc-item a {
        color:#eee;
      }
    }

    /* 移动端：悬浮目录全屏弹窗 */
    @media(max-width:768px){
      .sidebar-toc {
        left:0;
        width:100%;
        max-height: 55vh;
        border-radius: 0 0 12px 12px;
        top:100px;
      }
      .sidebar-toc.hidden {
        transform: translateY(-100vh);
      }
      #epub-viewer {
        height: calc(100vh - 72px);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <button id="toggleToc">目录</button>
    </div>
    <!-- 悬浮目录层，浮在上层，不挤压阅读器 -->
    <div id="tocSidebar" class="sidebar-toc"></div>
    <!-- 阅读器占满全部宽度高度 -->
    <div id="epub-viewer"></div>
  </div>

  <!-- 禁止右键菜单 -->
  <script>
    document.addEventListener('contextmenu', function (event) {
      event.preventDefault();
    });
  </script>

  <script type="module">
    import Epub from './epub-ts-bundle.js';

    const bookUrl = "./book.epub";
    const viewerEl = document.getElementById("epub-viewer");
    const tocSidebar = document.getElementById("tocSidebar");
    const toggleTocBtn = document.getElementById("toggleToc");

    let book;
    let rendition;

    // 递归渲染多级目录
    function renderToc(items, level=1){
      let html = "";
      for(const item of items){
        html += `
        <div class="toc-item toc-level-${level}">
          <a data-href="${item.href}" href="javascript:void(0)">${item.label}</a>
        </div>`;
        if(item.subitems && item.subitems.length>0){
          html += renderToc(item.subitems, level+1);
        }
      }
      return html;
    }

    // 清除全部active标记
    function clearTocActive(){
      tocSidebar.querySelectorAll('a.active-chapter').forEach(el=>el.classList.remove("active-chapter"));
    }

    // 绑定目录点击跳转
    function bindTocClick(){
      const links = tocSidebar.querySelectorAll('a[data-href]');
      links.forEach(link=>{
        link.onclick = async ()=>{
          const href = link.getAttribute("data-href");
          clearTocActive();
          link.classList.add("active-chapter");
          await rendition.display(href);
        }
      })
    }

    toggleTocBtn.onclick = ()=>{
      tocSidebar.classList.toggle("hidden");
    }

    async function initReader(){
      book = new Epub();
      await book.open(bookUrl);

      rendition = book.renderTo(viewerEl, {
        width: "100%",
        height: "100%",
        spread: "none",
        flow: "scrolled-continuous",
        manager:"continuous",
        allowScriptedContent: false
      });

      // 彻底屏蔽图片：img、background-image、svg:image
      rendition.hooks.content.register((contents) => {
        const noImageCss = `
          img { display: none !important; content: none !important; }
          svg image { display: none !important; }
          * { background-image: none !important; }
        `;
        contents.addStylesheet(noImageCss);

        // DOM层面直接删除图片节点，彻底消除占位
        contents.document.querySelectorAll('img, svg image').forEach(el => {
          if(el.parentNode) el.parentNode.removeChild(el);
        });
      });

      await rendition.display();
      await book.locations.generate(1000).catch(()=>{});

      const toc = book.navigation?.toc ?? [];
      if(toc.length>0){
        tocSidebar.innerHTML = renderToc(toc);
        bindTocClick();
        await rendition.display(toc[0].href);
      }else{
        tocSidebar.innerText = "本书无目录";
      }

      document.addEventListener("keydown", (e)=>{
        if(e.key === "ArrowRight") rendition.next();
        if(e.key === "ArrowLeft") rendition.prev();
      });
    }

    initReader().catch(err=>{
      console.error("epub加载失败",err);
      viewerEl.innerText = "书籍加载失败";
    });
  </script>
</body>
</html>
